<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon programme de festival</title>
    <link rel="stylesheet" href="style/style.css">
    <script type="module" src="./scripts/main.js" defer></script>
</head>
<body>
<header>
    <div class="header-panel">
        <h1>Mon programme de l'Étrange Festival</h1>
        <div class="search-bar">
            <select id="festival_selector"></select>
        </div>
    </div>
</header>
<main>
    <section class="main_panel">
        <div class="column" id="calendar">
            <button id="download_program_button">Download My Program</button>
        </div>
        <div class="column">
            <div class="column container" id="filters">
                <div class="search-container">
                    <input type="text" id="searchInput"
                           placeholder="Entrez un titre...">
                </div>
            </div>
            <div class=column id="show_description">
            </div>
        </div>
    </section>
    <section>
        <div #swiperRef="" class="swiper mySwiper">
            <div class="swiper-wrapper">
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </section>
</main>
<footer>
    <div class="centered">
        <a href="https://www.buymeacoffee.com/jjublanc"
           class="centered">☕ Si
            Vous pouvez me payer un café ici☕</a>
    </div>
    <h4>Contactez-moi par mail : johan.jublanc@gmail.com</h4>
    <h2>&copy; 2024 Mon programme de festival</h2>
</footer>
</body>
</html>
