<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon programme de festival</title>
</head>
<body>
<header>
    <div class="header-panel">
        <h1>Mon programme de l'Étrange Festival</h1>
        <div class="search-bar">
            <select id="festival_selector"></select>
        </div>
    </div>
</header>
<main>
    <section class="main_panel">
        <div class="column" id="calendar">
            <button id="download_program_button">Download My Program</button>
        </div>
        <div class="column">
            <div class="column container" id="filters">
                <div class="search-container">
                    <input type="text" id="searchInput"
                           placeholder="Entrez un titre...">
                </div>
            </div>
            <div class=column id="show_description">
            </div>
        </div>
    </section>
    <section>
        <div #swiperRef="" class="swiper mySwiper">
            <div class="swiper-wrapper">
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </section>
</main>
<footer>
    <div class="footer-support">
        <p>Cet outil est gratuit et sans publicité. Si il vous rend service, vous pouvez soutenir le projet :</p>
        <a class="coffee-button"
           href="https://www.buymeacoffee.com/jjublanc"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Soutenir le projet sur Buy Me a Coffee">
            <span class="coffee-icon" aria-hidden="true">☕</span>
            <span>Offrez-moi un café</span>
        </a>
    </div>
    <div class="footer-contact">
        <a href="mailto:johan.jublanc@gmail.com">johan.jublanc@gmail.com</a>
        <span>·</span>
        <span>&copy; 2026 Mon programme de festival</span>
    </div>
</footer>
</body>
</html>
